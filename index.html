<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SMF — Enter the Galaxy</title>
  <meta name="description" content="SMF's official links: Twitch, YouTube, TikTok, Instagram, Snapchat and X." />
  <meta name="theme-color" content="#05030f" />
  <meta property="og:title" content="SMF — Enter the Galaxy" />
  <meta property="og:description" content="All of SMF's accounts in one place." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05030f;
      --ink: #f1eeff;
      --muted: #9a93c7;
      --violet: #7c5cff;
      --cyan: #4de1ff;
      --pink: #ff5cc8;
      --px: 0; --py: 0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      cursor: default;
    }

    /* ---------- background layers ---------- */
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
    .nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .nebula i {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45;
      animation: drift 28s ease-in-out infinite alternate;
    }
    .nebula i:nth-child(1) { width: 55vmax; height: 55vmax; left: -15vmax; top: -10vmax; background: radial-gradient(circle, #4a2bd6, transparent 65%); }
    .nebula i:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: 25vh; background: radial-gradient(circle, #c0348f, transparent 65%); animation-duration: 34s; opacity: .30; }
    .nebula i:nth-child(3) { width: 45vmax; height: 45vmax; left: 20vw; bottom: -25vmax; background: radial-gradient(circle, #0f8fb5, transparent 65%); animation-duration: 40s; opacity: .28; }
    @keyframes drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.15); } }

    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(3, 1, 10, .75) 100%);
    }

    /* planet */
    .planet-wrap {
      position: fixed; z-index: 1; pointer-events: none;
      right: -90px; top: 8vh; width: 360px; height: 360px;
      transform: translate3d(calc(var(--px) * -26px), calc(var(--py) * -18px), 0);
      transition: transform .25s ease-out;
    }
    .planet {
      position: absolute; inset: 0; border-radius: 50%;
      background:
        radial-gradient(circle at 28% 28%, #b9a8ff 0%, #6c4df0 28%, #2c1a86 58%, #0c0626 82%);
      box-shadow: inset -50px -40px 90px rgba(0,0,0,.85), 0 0 120px rgba(124, 92, 255, .35);
      animation: bob 14s ease-in-out infinite alternate;
    }
    .planet::after { /* cloud bands */
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: repeating-linear-gradient(172deg, transparent 0 22px, rgba(255,255,255,.06) 22px 30px, transparent 30px 52px);
      mix-blend-mode: overlay;
    }
    .planet-ring {
      position: absolute; left: -30%; right: -30%; top: 38%; bottom: 38%;
      border-radius: 50%; border: 10px solid rgba(190, 170, 255, .35);
      border-bottom-color: rgba(190, 170, 255, .12);
      transform: rotate(-18deg);
      box-shadow: 0 0 30px rgba(124, 92, 255, .35);
    }
    .moon {
      position: fixed; z-index: 1; pointer-events: none;
      left: 6vw; bottom: 9vh; width: 74px; height: 74px; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #fff 0%, #cfd3ee 35%, #7d82a8 75%, #3a3d5c 100%);
      box-shadow: inset -14px -10px 22px rgba(0,0,0,.6), 0 0 40px rgba(200, 210, 255, .25);
      transform: translate3d(calc(var(--px) * 34px), calc(var(--py) * 24px), 0);
      transition: transform .25s ease-out;
      animation: bob 9s ease-in-out infinite alternate-reverse;
    }
    @keyframes bob { to { translate: 0 -14px; } }

    /* ---------- layout ---------- */
    main {
      position: relative; z-index: 2;
      min-height: calc(100vh - 4rem); min-height: calc(100dvh - 4rem);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 5rem 1.25rem 1rem;
      gap: 2.6rem;
    }

    .hero { text-align: center; display: grid; justify-items: center; gap: 1rem; }

    .logo-wrap { position: relative; display: grid; place-items: center; padding: 1.6rem 2.4rem; }
    .orbit {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px dashed rgba(170, 150, 255, .35);
      animation: spin 24s linear infinite;
    }
    .orbit.o2 { inset: -14px -30px; border-style: solid; border-color: rgba(77, 225, 255, .18); animation-duration: 38s; animation-direction: reverse; }
    .orbit::after {
      content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 14px 4px rgba(77, 225, 255, .8);
    }
    .orbit.o2::after { background: var(--pink); box-shadow: 0 0 14px 4px rgba(255, 92, 200, .8); }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: 'Orbitron', 'Outfit', sans-serif;
      font-weight: 900; letter-spacing: .22em; padding-left: .22em;
      font-size: clamp(3.6rem, 13vw, 8rem); line-height: 1;
      background: linear-gradient(100deg, #fff 0%, #cdbfff 30%, #7ee7ff 55%, #ff9be0 80%, #fff 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 22px rgba(124, 92, 255, .65));
      animation: sheen 7s linear infinite, rise 1.1s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes sheen { to { background-position: -220% 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(10px) drop-shadow(0 0 0 transparent); } }

    .tagline {
      font-weight: 300; letter-spacing: .28em; text-transform: uppercase;
      font-size: clamp(.72rem, 2.6vw, .95rem); color: var(--muted);
      min-height: 1.4em; animation: rise 1.2s .25s cubic-bezier(.2,.8,.2,1) both;
    }
    .tagline .caret { display: inline-block; width: 2px; height: 1em; margin-left: 4px; vertical-align: -.12em; background: var(--cyan); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- link cards ---------- */
    .grid {
      width: min(980px, 100%);
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem;
      perspective: 1000px;
    }
    .card {
      --c: var(--violet); --mx: 50%; --my: 50%;
      position: relative; display: flex; align-items: center; gap: 1rem;
      padding: 1.15rem 1.3rem; border-radius: 1.1rem; text-decoration: none; color: inherit;
      background: linear-gradient(145deg, rgba(30, 22, 70, .55), rgba(10, 7, 28, .6));
      border: 1px solid rgba(160, 140, 255, .18);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transform-style: preserve-3d;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .18s ease-out, border-color .3s, box-shadow .3s;
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
      animation-delay: calc(.35s + var(--i) * .09s);
      overflow: hidden; outline: none;
    }
    .card::before { /* cursor spotlight */
      content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .3s;
      background: radial-gradient(260px circle at var(--mx) var(--my), color-mix(in srgb, var(--c) 38%, transparent), transparent 70%);
    }
    .card::after { /* shine sweep */
      content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.16), transparent);
      transform: skewX(-20deg); transition: left .7s;
    }
    .card:hover, .card:focus-visible {
      border-color: color-mix(in srgb, var(--c) 75%, white 10%);
      box-shadow: 0 0 34px -6px var(--c), inset 0 0 22px -12px var(--c);
    }
    .card:hover::before, .card:focus-visible::before { opacity: 1; }
    .card:hover::after, .card:focus-visible::after { left: 130%; }

    .ico {
      position: relative; flex: none; width: 3rem; height: 3rem; border-radius: 50%;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--c) 22%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      transform: translateZ(30px);
      transition: transform .3s, background .3s;
    }
    .ico i {
      width: 1.45rem; height: 1.45rem; background: #fff; display: block;
      -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
    }
    .card.noicon .ico i { display: none; }
    .card.noicon .ico::before { content: attr(data-l); font: 800 1.1rem 'Orbitron', sans-serif; color: #fff; }
    .card:hover .ico { transform: translateZ(30px) scale(1.12) rotate(-6deg); background: color-mix(in srgb, var(--c) 45%, transparent); }
    .txt { position: relative; display: grid; gap: .1rem; min-width: 0; transform: translateZ(18px); }
    .txt b { font-weight: 600; font-size: 1.08rem; letter-spacing: .02em; }
    .txt span { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { position: relative; margin-inline-start: auto; color: var(--muted); transition: transform .3s, color .3s; font-size: 1.2rem; }
    .card:hover .arrow { transform: translate(4px, -4px); color: #fff; }

    /* ---------- misc ---------- */
    footer {
      position: relative; z-index: 3; padding: 1rem 1rem calc(1.4rem + env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 1.2rem; flex-wrap: wrap;
      font-size: .75rem; letter-spacing: .12em; color: rgba(154, 147, 199, .7);
    }
    .warp-btn {
      position: fixed; z-index: 3; top: 1rem; right: 1rem;
      font: 600 .72rem 'Orbitron', sans-serif; letter-spacing: .18em; color: var(--ink);
      padding: .65rem 1rem; border-radius: 999px; cursor: pointer;
      background: rgba(20, 14, 52, .6); border: 1px solid rgba(160, 140, 255, .35);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: box-shadow .3s, border-color .3s, transform .2s;
    }
    .warp-btn:hover, .warp-btn:focus-visible { border-color: var(--cyan); box-shadow: 0 0 22px -4px var(--cyan); outline: none; }
    .warp-btn:active { transform: scale(.95); }

    /* intro fade */
    #flash { position: fixed; inset: 0; z-index: 10; pointer-events: none; background: radial-gradient(circle, #fff, #8fe9ff 30%, transparent 70%); opacity: 0; }

    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .planet-wrap { width: 240px; height: 240px; right: -80px; top: 4vh; opacity: .8; }
      .moon { width: 52px; height: 52px; }
    }
    @media (max-width: 520px) {
      main { padding-top: 4.5rem; gap: 2rem; }
      .grid { grid-template-columns: 1fr; gap: .8rem; }
      .logo-wrap { padding: 1.2rem 1.6rem; }
      .warp-btn { padding: .55rem .8rem; font-size: .64rem; }
      footer { font-size: .66rem; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="planet-wrap" aria-hidden="true"><div class="planet"></div><div class="planet-ring"></div></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>

  <button class="warp-btn" id="warp" type="button" aria-label="Engage warp speed">⚡ WARP</button>

  <main>
    <header class="hero">
      <div class="logo-wrap">
        <div class="orbit"></div><div class="orbit o2"></div>
        <h1>SMF</h1>
      </div>
      <p class="tagline" aria-live="polite"><span id="typed"></span><span class="caret"></span></p>
    </header>

    <nav class="grid" aria-label="Social accounts">
      <a class="card" style="--i:0; --c:#9146ff; --icon:url(https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/twitch.svg)" href="https://twitch.tv/smfs" target="_blank" rel="noopener">
        <span class="ico"><i></i></span><span class="txt"><b>Twitch</b><span>twitch.tv/smfs</span></span><span class="arrow">↗</span>
      </a>
      <a class="card" style="--i:1; --c:#ff2d3d; --icon:url(https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/youtube.svg)" href="https://youtube.com/@smfsss" target="_blank" rel="noopener">
        <span class="ico"><i></i></span><span class="txt"><b>YouTube</b><span>@smfsss</span></span><span class="arrow">↗</span>
      </a>
      <a class="card" style="--i:2; --c:#25f4ee; --icon:url(https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/tiktok.svg)" href="https://tiktok.com/@ismfs" target="_blank" rel="noopener">
        <span class="ico"><i></i></span><span class="txt"><b>TikTok</b><span>@ismfs</span></span><span class="arrow">↗</span>
      </a>
      <a class="card" style="--i:3; --c:#ff4fa3; --icon:url(https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/instagram.svg)" href="https://instagram.com/not_smf" target="_blank" rel="noopener">
        <span class="ico"><i></i></span><span class="txt"><b>Instagram</b><span>@not_smf</span></span><span class="arrow">↗</span>
      </a>
      <a class="card" style="--i:4; --c:#fffc00; --icon:url(https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/snapchat.svg)" href="https://snapchat.com/add/notsmf" target="_blank" rel="noopener">
        <span class="ico"><i></i></span><span class="txt"><b>Snapchat</b><span>notsmf</span></span><span class="arrow">↗</span>
      </a>
      <a class="card" style="--i:5; --c:#8fc7ff; --icon:url(https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/x.svg)" href="https://x.com/notsmf" target="_blank" rel="noopener">
        <span class="ico"><i></i></span><span class="txt"><b>X / Twitter</b><span>@notsmf</span></span><span class="arrow">↗</span>
      </a>
    </nav>

  </main>

  <footer><span>© <span id="yr">2026</span> SMF</span><span>Built under the night sky ✦</span></footer>

<script>
(() => {
  'use strict';
  const reduce = false; // always animate
  const canHover = matchMedia('(hover: hover)').matches;
  const root = document.documentElement;
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* ---------- starfield ---------- */
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, stars = [], shooters = [], sparks = [];
  const mouse = { x: 0, y: 0, tx: 0, ty: 0, active: false, px: -999, py: -999 };
  let warp = 0, warpStart = -1;
  const WARP_MS = 1100;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.min(520, Math.floor((W * H) / 3200));
    stars = Array.from({ length: n }, () => {
      const z = Math.random() ** 1.6 * 0.95 + 0.05;           // depth 0.05 – 1
      const t = Math.random();
      return {
        x: Math.random() * W, y: Math.random() * H, z,
        r: 0.3 + z * 1.5,
        ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.8,
        col: t < .12 ? '170,200,255' : t < .22 ? '255,200,170' : t < .30 ? '220,170,255' : '255,255,255'
      };
    });
    if (reduce) draw(0);
  }

  function spawnShooter() {
    const fromLeft = Math.random() < .5;
    const ang = (fromLeft ? 20 + Math.random() * 25 : 160 - Math.random() * 25) * Math.PI / 180;
    shooters.push({
      x: Math.random() * W * .8 + (fromLeft ? 0 : W * .2), y: Math.random() * H * .4,
      vx: Math.cos(ang) * (700 + Math.random() * 500), vy: Math.sin(ang) * (700 + Math.random() * 500),
      life: 0, max: .9 + Math.random() * .5
    });
  }
  let nextShooter = 1.5;

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    mouse.x += (mouse.tx - mouse.x) * 0.06;
    mouse.y += (mouse.ty - mouse.y) * 0.06;
    root.style.setProperty('--px', mouse.x.toFixed(3));
    root.style.setProperty('--py', mouse.y.toFixed(3));
    const cx = W / 2, cy = H / 2;

    for (const s of stars) {
      const tw = reduce ? 1 : 0.55 + 0.45 * Math.sin(t * 0.001 * s.sp + s.ph);
      let x = s.x - mouse.x * s.z * 28, y = s.y - mouse.y * s.z * 28;
      x = ((x % W) + W) % W; y = ((y % H) + H) % H;

      if (warp > 0.01) {
        const dx = x - cx, dy = y - cy, k = 1 + warp * s.z * 2.4;
        ctx.strokeStyle = `rgba(${s.col},${0.35 + 0.5 * s.z})`;
        ctx.lineWidth = s.r * (0.8 + warp);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(cx + dx * k, cy + dy * k); ctx.stroke();
        continue;
      }
      // attraction glow near cursor
      let boost = 1;
      if (mouse.active) {
        const d = Math.hypot(x - mouse.px, y - mouse.py);
        if (d < 140) boost = 1 + (1 - d / 140) * 2.2;
      }
      ctx.globalAlpha = Math.min(1, (0.25 + 0.75 * s.z) * tw * boost);
      ctx.fillStyle = `rgb(${s.col})`;
      ctx.beginPath(); ctx.arc(x, y, s.r * (boost > 1 ? 1 + (boost - 1) * .3 : 1), 0, 6.283); ctx.fill();
      if (s.z > .8) { // soft halo on the brightest ones
        ctx.globalAlpha *= .18; ctx.beginPath(); ctx.arc(x, y, s.r * 4, 0, 6.283); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // constellation lines to the cursor
    if (mouse.active && warp < .01 && !reduce) {
      const near = [];
      for (const s of stars) {
        if (s.z < .35) continue;
        let x = ((s.x - mouse.x * s.z * 28) % W + W) % W, y = ((s.y - mouse.y * s.z * 28) % H + H) % H;
        const d = Math.hypot(x - mouse.px, y - mouse.py);
        if (d < 170) near.push({ x, y, d });
      }
      near.sort((a, b) => a.d - b.d);
      const pts = near.slice(0, 7);
      ctx.lineWidth = 1;
      for (let i = 0; i < pts.length; i++) {
        ctx.strokeStyle = `rgba(160,190,255,${0.5 * (1 - pts[i].d / 170)})`;
        ctx.beginPath(); ctx.moveTo(mouse.px, mouse.py); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
        if (i) {
          ctx.strokeStyle = `rgba(160,190,255,${0.18})`;
          ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
        }
      }
    }

    // shooting stars
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      const dt = 1 / 60;
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const a = Math.sin(Math.min(1, s.life / s.max) * Math.PI);
      const len = 0.09;
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * len, s.y - s.vy * len);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(120,160,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * len, s.y - s.vy * len); ctx.stroke();
      if (s.life > s.max) shooters.splice(i, 1);
    }

    // sparkle trail
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life -= 0.02; p.x += p.vx; p.y += p.vy; p.vy += 0.015;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let last = 0;
  function loop(t) {
    const dt = (t - last) / 1000; last = t;
    if (warpStart >= 0) {
      const p = (t - warpStart) / WARP_MS;
      if (p >= 1) { warp = 0; warpStart = -1; flash.style.opacity = 0; }
      else {
        warp = Math.sin(p * Math.PI);
        flash.style.opacity = Math.max(0, (p - .35) * 1.4) * (p < .5 ? 1 : (1 - p) * 2) * .55;
      }
    }
    if (!reduce) {
      nextShooter -= dt;
      if (nextShooter <= 0 && !document.hidden) { spawnShooter(); nextShooter = 2 + Math.random() * 5; }
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  const flash = document.getElementById('flash');
  function engageWarp() { if (!reduce && warpStart < 0) warpStart = performance.now(); }
  document.getElementById('warp').addEventListener('click', engageWarp);

  /* ---------- pointer ---------- */
  const COLORS = ['#a98bff', '#7ee7ff', '#ff9be0', '#ffffff'];
  addEventListener('pointermove', e => {
    mouse.tx = (e.clientX / W - .5) * 2; mouse.ty = (e.clientY / H - .5) * 2;
    mouse.px = e.clientX; mouse.py = e.clientY; mouse.active = true;
    if (!reduce && Math.random() < .55 && sparks.length < 120) {
      sparks.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - .5) * .8, vy: (Math.random() - .5) * .8 - .2,
                    r: 1 + Math.random() * 2.2, life: 1, c: COLORS[(Math.random() * 4) | 0] });
    }
  }, { passive: true });
  addEventListener('pointerleave', () => { mouse.active = false; mouse.tx = mouse.ty = 0; });
  addEventListener('pointerdown', e => {              // burst on tap / click
    if (reduce) return;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.283, v = 1 + Math.random() * 2.6;
      sparks.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                    r: 1.5 + Math.random() * 2.5, life: 1, c: COLORS[(Math.random() * 4) | 0] });
    }
  }, { passive: true });
  addEventListener('deviceorientation', e => {        // phone tilt parallax
    if (e.gamma == null) return;
    mouse.tx = Math.max(-1, Math.min(1, e.gamma / 30)); mouse.ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  });

  /* ---------- cards: tilt + spotlight + warp on click ---------- */
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.setProperty('--mx', x + 'px'); card.style.setProperty('--my', y + 'px');
      if (canHover && !reduce) {
        card.style.setProperty('--ry', ((x / r.width - .5) * 14).toFixed(2) + 'deg');
        card.style.setProperty('--rx', ((.5 - y / r.height) * 14).toFixed(2) + 'deg');
      }
    });
    card.addEventListener('pointerleave', () => { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); });
    card.addEventListener('click', engageWarp);
  });

  /* icon fallback: if the icon CDN is unreachable, show the first letter */
  document.querySelectorAll('.card').forEach(card => {
    const m = /url\((.+?)\)/.exec(card.getAttribute('style') || '');
    const ico = card.querySelector('.ico');
    ico.dataset.l = card.querySelector('b').textContent.charAt(0);
    if (!m) return;
    const img = new Image();
    img.onerror = () => card.classList.add('noicon');
    img.src = m[1];
  });

  /* ---------- typed tagline ---------- */
  const phrases = ['Welcome to my galaxy', 'Pick a planet to explore', 'Streams · Videos · Stories', 'See you among the stars'];
  const el = document.getElementById('typed');
  if (reduce) el.textContent = phrases[0];
  else {
    let pi = 0, ci = 0, del = false;
    (function tick() {
      const w = phrases[pi];
      el.textContent = w.slice(0, ci);
      if (!del && ci === w.length) { del = true; return setTimeout(tick, 1800); }
      if (del && ci === 0) { del = false; pi = (pi + 1) % phrases.length; return setTimeout(tick, 400); }
      ci += del ? -1 : 1;
      setTimeout(tick, del ? 28 : 65);
    })();
  }

  addEventListener('resize', resize);
  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
